name: Update formula
# Polls weather-outlook's latest release so the tap needs no cross-repo token.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./update-formula.sh
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Formula is current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "weather-outlook $(sed -n 's/^  version "\(.*\)"/\1/p' Formula/weather-outlook.rb)"
          git push
